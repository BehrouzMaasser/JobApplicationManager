{% extends "base.html" %}

{% block title %}
{{ application_note.title }}
{% endblock %}

{% block content %}

<div class="page-header">

    <h1>
        {{ application_note.title }}
    </h1>

    <p class="page-description">
        Job Application Note
    </p>

    <div class="action-bar">

        <a
            class="btn btn-secondary"
            href="{% url 'job-application-note-edit-web' application_note.pk %}"
        >
            Edit
        </a>

        <a
            class="btn btn-danger"
            href="{% url 'job-application-note-delete-web' application_note.pk %}"
        >
            Delete
        </a>

    </div>

</div>

<div class="card section-card">

    <h2 class="section-title">
        Note Content
    </h2>

    <div class="mini-item">
        {{ application_note.content|linebreaks }}
    </div>

</div>

{% endblock %}
