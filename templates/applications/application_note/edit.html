<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Job Application Note</title>
</head>
<body>
<h1>Edit Job Application Note</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Save Changes</button>
</form>
<p>
    <a href="{% url 'job-application-note-detail-web' pk=object.pk %}">Cancel</a>
</p>

<a href="{% url 'job-application-detail-web' pk=app_context.application_id %}">
    Back to job application
</a>
|
<a href="{% url 'job-position-detail-web' workspace_id=app_context.workspace_id company_id=app_context.company_id pk=app_context.position_id %}">
    Back to job position
</a>
|
<a href="{% url 'company-detail-web' workspace_id=app_context.workspace_id pk=app_context.company_id %}">
    Back to company
</a>
|
<a href="{% url 'workspace-detail-web' workspace_id=app_context.workspace_id %}">
    Back to job workspace
</a>
|
<a href="{% url 'dashboard' %}">
    Back to dashboard
</a>
</body>
</html>
