{% extends "base.html" %}

{% block content %}

<div class="card" style="max-width:600px;">

    <h1>{{ extra_context.page_title }}</h1>

    <p>
        You are about to delete:
    </p>

    <div class="card">{{ object }}</div>

    <br>

    <form method="post">

        {% csrf_token %}

        <button
            type="submit"
            class="btn btn-danger"
        >
            Delete
        </button>

        <a
            href="javascript:history.back()"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
