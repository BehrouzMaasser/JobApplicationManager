{% extends "base.html" %}

{% block title %}
{{ job_benefit.name }}
{% endblock %}

{% block content %}

<div class="page-header">

    <h1>{{ job_benefit.name }}</h1>

    <p class="page-description">
        Job Benefit Information
    </p>

    <div class="action-bar">

        <a
            class="btn btn-secondary"
            href="{% url 'job-benefit-edit-web' job_benefit.pk %}"
        >
            Edit
        </a>

        <a
            class="btn btn-danger"
            href="{% url 'job-benefit-delete-web' job_benefit.pk %}"
        >
            Delete
        </a>

    </div>

</div>

<div class="card">

    <h2 class="section-title">
        Description
    </h2>

    <div class="mini-item">
        {{ job_benefit.description|linebreaks }}
    </div>

</div>

{% endblock %}
