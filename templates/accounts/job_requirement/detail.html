{% extends "base.html" %}

{% block title %}
{{ job_requirement.title }}
{% endblock %}

{% block content %}

<div class="page-header">

    <h1>{{ job_requirement.title }}</h1>

    <p class="page-description">
        Job Requirement Information
    </p>

    <div class="action-bar">

        <a
            class="btn btn-secondary"
            href="{% url 'job-requirement-edit-web' job_requirement.pk %}"
        >
            Edit
        </a>

        <a
            class="btn btn-danger"
            href="{% url 'job-requirement-delete-web' job_requirement.pk %}"
        >
            Delete
        </a>

    </div>

</div>

<div class="card">

    <h2 class="section-title">
        Description
    </h2>

    <div class="mini-item">
        {{ job_requirement.description|linebreaks }}
    </div>

</div>

{% endblock %}
