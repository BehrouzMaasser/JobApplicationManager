<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Company's Notes</title>
</head>
<body>
<h1>Company's Notes</h1>

<a href="{% url 'company-note-create-web' workspace_id=app_context.workspace_id company_id=app_context.company_id %}">+ Create Note</a>
<a href="{% url 'company-detail-web' workspace_id=app_context.workspace_id pk=app_context.company_id %}">
    Back to company
</a>
<hr>

{% if notes %}
    {% for note in notes %}
        <div>
            <h3>{{ note.title }}</h3>
            <p>{{ note.content }}</p>

            <a href="{% url 'company-note-detail-web' workspace_id=app_context.workspace_id company_id=app_context.company_id pk=note.pk %}">Open</a>
            |
            <a href="{% url 'company-note-edit-web' workspace_id=app_context.workspace_id company_id=app_context.company_id pk=note.pk %}">Edit</a>
            |
            <a href="{% url 'company-note-delete-web' workspace_id=app_context.workspace_id company_id=app_context.company_id pk=note.pk %}">Delete</a>
        </div>
        <hr>
    {% endfor %}
{% else %}
    <p>No notes yet.</p>
    <a href="{% url 'company-note-create-web' workspace_id=app_context.workspace_id company_id=app_context.company_id %}">
        Create your first company note
    </a>
{% endif %}
</body>
</html>
