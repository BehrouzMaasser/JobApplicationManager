{% extends "base.html" %}

{% block title %}
{{ email.title }}
{% endblock %}

{% block content %}

<div class="page-header">

    <h1>{{ email.title }}</h1>

    <p class="page-description">
        Company Email
    </p>

    <div class="action-bar">

        <a
            class="btn btn-primary"
            href="{% url 'company-email-create-web' app_context.workspace_id app_context.company_id %}"
        >
            + Add Email
        </a>

        <a
            class="btn btn-secondary"
            href="{% url 'company-email-edit-web' email.pk %}"
        >
            Edit
        </a>

        <a
            class="btn btn-danger"
            href="{% url 'company-email-delete-web' email.pk %}"
        >
            Delete
        </a>

    </div>

</div>

<div class="card section-card">

    <h2 class="section-title">
        Email Address
    </h2>

    <div class="mini-item">
        {{ email.email|linebreaks }}
    </div>

</div>

{% endblock %}
