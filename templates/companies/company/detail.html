<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ company.name }}</title>
</head>
<body>
<h1>{{ company.name }}</h1>

<p>Company details page</p>

<p>Website:</p>
<p><a href="{{ company.website }}">{{ company.website }}</a></p>
<p>Emails:</p>
{% if company.emails.all %}
    <ul>
        {% for email in company.emails.all %}
            <li><a>{{ email.title }}: {{ email.email }}</a></li>
        {% endfor %}
    </ul>
{% else %}
<p>No Emails Yet!</p>
{% endif %}


<a href="{% url 'company-edit-web' workspace_id=app_context.workspace_id pk=app_context.company_id %}">Edit</a>
|
<a href="{% url 'company-delete-web' workspace_id=app_context.workspace_id pk=app_context.company_id %}">Delete</a>
|
<a href="{% url 'company-list-web' app_context.workspace_id %}">
    Back to Companies
</a>
</body>
</html>
