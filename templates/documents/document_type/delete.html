<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Document Type</title>
</head>
<body>
<h1>Delete Document Type</h1>

<p>Are you sure you want to delete "{{ object.name }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>

<a href="{% url 'document-type-detail-web' object.pk %}">Cancel</a>
<p><a href="{% url 'dashboard' %}">Back to Dashboard</a></p>
</body>
</html>
